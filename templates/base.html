{% load static %}
{% load i18n %}

<!DOCTYPE html>
<html lang="en">
<head
>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="{% static 'main/css/header.css' %}" rel="stylesheet">
    {% block css %}{% endblock %}
</head>
<body>

<!-- Header -->
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black ">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <img src="{% static 'main/images/logo.png' %}" alt="Logo" width="50">
                <span class="mb-0 fs-7"><h4 style="display: inline" class="fs-3">A</h4>LL<h4 class="fs-3" style="display: inline">W</h4>AYS</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto mb-0 gap-3">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'main' %}">{% trans "Home" %}</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'maps' %}">{% trans "Map" %}</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'statistics' %}">{% trans "Statistics" %}</a>
                    </li>
                    <li>
<a class="btn btn-warning btn-sm nav-link text-white text-decoration-none"
   href="{% url 'donate' %}"
   style="text-decoration: none !important;">
   {% trans "Donate" %}
</a>                </ul>
            </div>
        </div>
    </nav>
</header>



<!-- Content -->
{% block content %}{% endblock %}

<!-- Footer -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
{% block javascript %}{% endblock %}

</body>
</html>
