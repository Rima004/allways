{% extends 'base.html' %}
{% load static %}

{% block css %}
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>
<link href="{% static 'main/css/donate.css' %}" rel="stylesheet">
<title>Allways</title>
{% endblock%}

{% block content %}
 <section class="donate-container">
    <form action="details" class="donate-form">
      <h1 class="donate-title">Choose amount</h1>

      <div class="donate-options">
        <button type="button" class="donate-button active" data-type="one-time">
          One-time
        </button>
        <button type="button" class="donate-button with-icon" data-type="monthly">
          <i class="fas fa-heart"></i>
          Monthly
        </button>
        <button type="button" class="donate-button" data-type="annually">
          Annually
        </button>
      </div>

      <div>
        <label for="currency" class="donate-label">Currency</label>
        <select name="currency" id="currency" class="donate-input">
          <option value="mdl">MDL</option>
          <option value="ron">RON</option>
          <option value="eur">EUR</option>
          <option value="usd">USD</option>
        </select>
      </div>

      <div>
        <label for="amount" class="donate-label">Enter amount</label>
        <input
          id="amount"
          name="amount"
          type="number"
          placeholder="Enter amount"
          min="1"
          required
          class="donate-input"
        />
      </div>

      <button type="submit" class="donate-submit "><a class ="text-decoration-none text-white" href="">Next →</a></button>
    </form>
  </section>

{% endblock %}
{% block javascript %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
  const buttons = document.querySelectorAll(".donate-button");

  buttons.forEach((button) => {
    button.addEventListener("click", () => {
      buttons.forEach((btn) => btn.classList.remove("active"));
      button.classList.add("active");



    });
  });
});
</script>

{% endblock %}
